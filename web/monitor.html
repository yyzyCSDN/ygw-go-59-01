<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>EpochClock 时序监控</title>
  <style>
    body { font-family: "Segoe UI", "Microsoft YaHei", sans-serif; margin: 24px; background: #f5f7fa; color: #22303f; }
    h1 { font-size: 22px; }
    .card { background: #fff; border: 1px solid #e2e8f0; border-radius: 8px; padding: 16px; margin: 12px 0; }
    .card h2 { font-size: 15px; margin: 0 0 10px; color: #334155; }
    table { border-collapse: collapse; width: 100%; font-size: 13px; }
    th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid #edf2f7; }
    th { color: #64748b; font-weight: 600; }
    .ok { color: #16a34a; }
    .warn { color: #d97706; }
    .bad { color: #dc2626; }
    .meta { color: #64748b; font-size: 12px; }
    #refresh { margin-left: 8px; padding: 4px 12px; border: 0; background: #2563eb; color: #fff; border-radius: 6px; cursor: pointer; }
  </style>
</head>
<body>
  <h1>EpochClock 时序监控 <button id="refresh">刷新</button></h1>
  <div class="meta" id="meta">加载中…</div>

  <div class="card">
    <h2>时钟状态</h2>
    <div id="clock">-</div>
  </div>

  <div class="card">
    <h2>节点</h2>
    <table id="nodes"><thead><tr><th>ID</th><th>名称</th><th>指纹</th><th>注册时间</th><th>状态</th></tr></thead><tbody></tbody></table>
  </div>

  <div class="card">
    <h2>签发租约</h2>
    <table id="leases"><thead><tr><th>租约 ID</th><th>节点</th><th>状态</th><th>到期时间</th><th>纪元</th></tr></thead><tbody></tbody></table>
  </div>

  <div class="card">
    <h2>序列区间</h2>
    <table id="ranges"><thead><tr><th>区间 ID</th><th>起始</th><th>结束</th><th>游标</th><th>状态</th></tr></thead><tbody></tbody></table>
  </div>

  <div class="card">
    <h2>运行指标</h2>
    <table id="metrics"><thead><tr><th>指标</th><th>数值</th></tr></thead><tbody></tbody></table>
  </div>

  <script>
    async function load() {
      try {
        const res = await fetch('/api/status');
        if (!res.ok) throw new Error('status ' + res.status);
        const data = await res.json();
        render(data);
      } catch (err) {
        document.getElementById('meta').textContent = '加载失败: ' + err.message;
      }
    }

    function render(data) {
      document.getElementById('meta').textContent = '更新于 ' + new Date().toLocaleTimeString() + '，服务 ' + (data.up ? '运行中' : '未知');
      const clock = data.clock || {};
      document.getElementById('clock').textContent = '物理 ' + clock.physical + ' · 逻辑 ' + clock.logical;

      const nodesBody = document.querySelector('#nodes tbody');
      nodesBody.innerHTML = '';
      for (const n of data.nodes || []) {
        const tr = document.createElement('tr');
        tr.innerHTML = '<td>' + n.id + '</td><td>' + n.name + '</td><td>' + n.fingerprint +
          '</td><td>' + n.registered_at + '</td><td class="' + (n.active ? 'ok' : 'bad') + '">' +
          (n.active ? '在线' : '离线') + '</td>';
        nodesBody.appendChild(tr);
      }

      const leasesBody = document.querySelector('#leases tbody');
      leasesBody.innerHTML = '';
      for (const l of data.leases || []) {
        const tr = document.createElement('tr');
        const cls = l.state === 'granted' ? 'ok' : (l.state === 'expired' || l.state === 'transferred' ? 'bad' : 'warn');
        tr.innerHTML = '<td>' + l.id + '</td><td>' + l.node_id + '</td><td class="' + cls + '">' +
          l.state + '</td><td>' + l.expires_at + '</td><td>' + l.epoch + '</td>';
        leasesBody.appendChild(tr);
      }

      const rangesBody = document.querySelector('#ranges tbody');
      rangesBody.innerHTML = '';
      for (const r of data.ranges || []) {
        const tr = document.createElement('tr');
        const cls = r.state === 'exhausted' ? 'bad' : (r.state === 'draining' ? 'warn' : 'ok');
        tr.innerHTML = '<td>' + r.id + '</td><td>' + r.start + '</td><td>' + r.end + '</td><td>' +
          r.next + '</td><td class="' + cls + '">' + r.state + '</td>';
        rangesBody.appendChild(tr);
      }

      const metricsBody = document.querySelector('#metrics tbody');
      metricsBody.innerHTML = '';
      for (const key of Object.keys(data.metrics || {}).sort()) {
        const tr = document.createElement('tr');
        tr.innerHTML = '<td>' + key + '</td><td>' + data.metrics[key] + '</td>';
        metricsBody.appendChild(tr);
      }
    }

    document.getElementById('refresh').addEventListener('click', load);
    load();
  </script>
</body>
</html>
